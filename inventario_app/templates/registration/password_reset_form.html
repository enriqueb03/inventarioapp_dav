{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reiniciar Contraseña</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <div class="min-h-screen flex items-center justify-center py-12 px-4">
        <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl">
            
            <div>
                <h2 class="mt-6 text-center text-3xl font-bold tracking-tight text-gray-900">
                    ¿Olvidaste tu contraseña?
                </h2>
                <p class="mt-2 text-center text-sm text-gray-600">
                    Ingresa tu email y te enviaremos un enlace para reiniciarla.
                </p>
            </div>
            
            <form class="mt-8 space-y-6" method="post">
                {% csrf_token %}
                
                <div class="rounded-md shadow-sm">
                    <div>
                        <label for="id_email" class="sr-only">Email</label>
                        <input id="id_email" name="email" type="email" autocomplete="email" required 
                               class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" 
                               placeholder="Tu dirección de correo">
                    </div>
                </div>

                <div>
                    <button type="submit" 
                            class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                        Enviar enlace
                    </button>
                </div>
            </form>
             <p class="mt-4 text-center text-sm text-gray-600">
                <a href="{% url 'login' %}" class="font-medium text-blue-600 hover:text-blue-500">
                    &larr; Volver a Iniciar Sesión
                </a>
            </p>
        </div>
    </div>
</body>
</html>
