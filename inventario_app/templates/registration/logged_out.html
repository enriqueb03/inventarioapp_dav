{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sesión Cerrada</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <div class="min-h-screen flex items-center justify-center py-12 px-4">
        <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl text-center">
            
            <svg class="mx-auto h-12 w-auto text-green-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
             </svg>
            
            <h2 class="mt-6 text-2xl font-bold tracking-tight text-gray-900">
                Has cerrado sesión
            </h2>
            <p class="mt-2 text-sm text-gray-600">
                Gracias por usar el sistema de inventario.
            </p>
            <p class="mt-6">
                <a href="{% url 'login' %}" class="font-medium text-blue-600 hover:text-blue-500">
                    Volver a Iniciar Sesión
                </a>
            </p>
        </div>
    </div>
</body>
</html>
